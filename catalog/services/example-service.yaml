# Illustrative only: supply real version pins, image digest, artifact revision,
# gateway, DNS and a selector for only this service's live key ConfigMaps.
name: example-service
namespace: example-inference
gateway:
  name: example-gateway
  namespace: example-gateway-system
  hostname: inference.example.invalid
  keySelector:
    thalamus.example.invalid/service: example-service
versions:
  kserve: replace-with-tested-version
  agentgateway: replace-with-tested-version
  inferenceExtension: replace-with-tested-version
  vllm: replace-with-tested-version
deployments:
  - name: example-deployment
    artifact: example-model
    hardware: example-gpu
    image: vllm/vllm-openai:example-tag
    replicas: 1
    contextLength: 4096
    # Enable only with an engine/model/tokenizer image pinned by sha256 digest
    # and a matching oci:// artifact URI; it is not runtime evidence.
    packagedModel: false
    maxNumSeqs: 64
    maxNumBatchedTokens: 4096
    tensorParallelSize: 1
    weight: 1
    features:
      toolParser: ""
      reasoningParser: ""
      prefixCaching: true
      kvOffloadGi: 0
      shmGi: 1
agenticMode: disabled
scalingMode: fixed
trafficClasses: false
