[package]
name = "thalamus-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thalamus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net"] }
