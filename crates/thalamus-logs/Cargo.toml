[package]
name = "thalamus-logs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
utoipa = "5"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }