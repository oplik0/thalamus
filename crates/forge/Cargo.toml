[package]
name = "thalamus-forge"
version = "0.1.0"
edition = "2024"
description = "Unified forge review API for Thalamus"
license = "Apache-2.0"

[features]
default = ["github"]
github = ["dep:octocrab", "dep:hmac", "dep:sha2", "dep:hex", "dep:async-stream"]
gitlab = []
forgejo = []

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
octocrab = { version = "0.54.5", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
async-stream = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
