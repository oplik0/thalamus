[package]
name = "thalamus-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
forge = { package = "thalamus-forge", path = "../forge", features = ["github"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
k8s-openapi = { version = "0.24", features = ["v1_30"] }
kube = { version = "0.98", features = ["client", "runtime", "rustls-tls"] }
object_store = { version = "0.11", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thalamus-access = { path = "../thalamus-access" }
thalamus-changes = { path = "../thalamus-changes" }
thalamus-gitops = { path = "../thalamus-gitops" }
thalamus-identity = { path = "../thalamus-identity" }
thalamus-debug = { path = "../thalamus-debug" }
thalamus-k8s = { path = "../thalamus-k8s" }
thalamus-runs = { path = "../thalamus-runs" }
thalamus-runtime = { path = "../thalamus-runtime" }
thalamus-usage = { path = "../thalamus-usage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
