services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: thalamus
      POSTGRES_DB: thalamus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD externally}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thalamus -d thalamus"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: thalamus-v2:local
    command: ["thalamus-server"]
    env_file: .env.server
    ports:
      - "127.0.0.1:${THALAMUS_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${THALAMUS_WORKSPACE_DIR:?Set THALAMUS_WORKSPACE_DIR to the operator workspace}
        target: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: thalamus-v2:local
    command: ["thalamus-worker"]
    env_file: .env.worker
    environment:
      KUBECONFIG: /run/kube/config
    volumes:
      - type: bind
        source: ${THALAMUS_WORKSPACE_DIR:?Set THALAMUS_WORKSPACE_DIR to the operator workspace}
        target: /workspace
        read_only: true
      - type: bind
        source: ${THALAMUS_KUBECONFIG_DIR:?Set THALAMUS_KUBECONFIG_DIR to a kubeconfig directory}
        target: /run/kube
        read_only: true
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
