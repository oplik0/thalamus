name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thalamus
          POSTGRES_PASSWORD: thalamus
          POSTGRES_DB: thalamus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thalamus -d thalamus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://thalamus:thalamus@localhost:5432/thalamus_test
      TEST_DATABASE_URL: postgres://thalamus:thalamus@localhost:5432/thalamus_test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace

  kcl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          install_args: kcl
      - name: Render illustrative KCL example
        run: kcl main.k -D service_file=catalog/services/example-service.yaml

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui-v2/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir ui-v2 install --frozen-lockfile
      - name: Check UI
        run: pnpm --dir ui-v2 run check
      - name: Build UI
        run: pnpm --dir ui-v2 run build
      - name: Test UI
        run: pnpm --dir ui-v2 run test
