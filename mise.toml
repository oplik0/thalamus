[tools]
rust = "1.94.1"
node = "24"
pnpm = "10"
kcl = "0.13.2"
hk = "1.48.0"
"aqua:editorconfig-checker/editorconfig-checker" = "latest"

[env]
HK_PKL_BACKEND = "pklr"

[tasks.build]
description = "Build the v2 Rust workspace"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Test the v2 Rust workspace"
run = "cargo test --workspace"

[tasks.check]
description = "Check the v2 Rust workspace"
run = "cargo check --workspace --all-targets"

[tasks.fmt]
description = "Format the v2 Rust workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."ui:install"]
description = "Install v2 UI dependencies"
dir = "ui-v2"
run = "pnpm install --frozen-lockfile"

[tasks."ui:dev"]
description = "Run the v2 UI development server"
dir = "ui-v2"
run = "pnpm run dev"

[tasks."ui:check"]
description = "Check the v2 UI"
dir = "ui-v2"
run = "pnpm run check"

[tasks."ui:build"]
description = "Build the v2 UI"
dir = "ui-v2"
run = "pnpm run build"

[tasks."ui:test"]
description = "Test the v2 UI"
dir = "ui-v2"
run = "pnpm run test"

[tasks."kcl:render"]
description = "Render the illustrative KCL service example"
run = "kcl main.k -D service_file=catalog/services/example-service.yaml"

[tasks.ci]
description = "Run v2 Rust, UI and illustrative KCL checks"
run = '''
  cargo fmt --all -- --check
  cargo build --workspace --all-targets
  cargo test --workspace
  kcl main.k -D service_file=catalog/services/example-service.yaml
  pnpm --dir ui-v2 run check
  pnpm --dir ui-v2 run build
  pnpm --dir ui-v2 run test
'''
