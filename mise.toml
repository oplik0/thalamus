[tools]
rust = "1.94.1"
node = "24"
pnpm = "10"
kcl = "0.13.2"
go = "1.27.3"
hk = "1.48.0"
"aqua:editorconfig-checker/editorconfig-checker" = "latest"

[env]
HK_PKL_BACKEND = "pklr"

[tasks.build]
description = "Build the v2 Rust workspace"
run = "cargo build --workspace --all-targets --all-features"

[tasks.test]
description = "Test the v2 Rust workspace"
run = '''
  set -eu
  kcl="$(mise which kcl)"
  python="$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')"
  PATH="$(dirname "$kcl"):$(dirname "$python"):$PATH" cargo test --workspace --all-features
'''

[tasks.check]
description = "Check the v2 Rust workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.fmt]
description = "Format the v2 Rust workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."ui:install"]
description = "Install v2 UI dependencies"
dir = "ui"
run = "pnpm install --frozen-lockfile"

[tasks."ui:dev"]
description = "Run the v2 UI development server"
dir = "ui"
run = "pnpm run dev"

[tasks."ui:check"]
description = "Check the v2 UI"
dir = "ui"
run = "pnpm run check"

[tasks."ui:build"]
description = "Build the v2 UI"
dir = "ui"
run = "pnpm run build"

[tasks."ui:test"]
description = "Test the v2 UI"
dir = "ui"
run = "pnpm run test"

[tasks."kcl:render"]
description = "Render the baseline service catalog"
run = "kcl main.k -D service_file=catalog/services/example-service.yaml"

[tasks."kcl:schema"]
description = "Regenerate the Service JSON Schema from KCL"
run = "python3 scripts/generate-service-schema.py"

[tasks."deployment:render"]
description = "Render the offline fresh-installation fixture"
run = "kcl deploy/install.k -D config_file=install.fixture.yaml"

[tasks.ci]
description = "Run Rust, UI, catalog and offline deployment checks"
run = '''
  set -eu
  kcl="$(mise which kcl)"
  python="$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')"
  export PATH="$(dirname "$kcl"):$(dirname "$python"):$PATH"
  cargo fmt --all -- --check
  cargo build --workspace --all-targets --all-features
  cargo test --workspace --all-features
  cargo clippy --workspace --all-targets --all-features -- -D warnings
  python3 -m unittest discover -s scripts/inference-perf -p 'test_*.py'
  python3 scripts/generate-service-schema.py --check
  python3 scripts/render-catalog.py --check --workload-namespace thalamus-inference
  python3 -B -m unittest discover -s scripts -p 'test_render_catalog.py'
  kcl main.k -D service_file=catalog/services/example-service.yaml
  kcl deploy/install.k -D config_file=install.fixture.yaml
  kcl limits.k -D limit_file=catalog/limits/example-shared.yaml
  kcl pool.k -D pool_file=catalog/pools/example-pool.yaml
  kcl test ./templates/serving
  kcl test ./templates/features
  kcl test ./templates/gateway
  kcl test ./templates/platform
  pnpm --dir ui run check
  pnpm --dir ui run build
  pnpm --dir ui run test
'''
